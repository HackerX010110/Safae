<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little something for you</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #FFF6F9, #FBEAF0);
    padding: 1rem;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .bg-heart {
    position: fixed;
    bottom: -10vh;
    font-size: 28px;
    color: #ED93B1;
    opacity: 0.5;
    animation: floatUp linear infinite;
    z-index: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
  }
  #app {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 2rem clamp(1rem, 5vw, 1.5rem);
    background: #ffffff;
    border-radius: 24px;
    border: 0.5px solid #ED93B1;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    box-shadow: 0 10px 30px rgba(212, 83, 126, 0.12);
    z-index: 1;
  }
  #app button {
    border-radius: 999px;
    border: 0.5px solid #ED93B1;
    background: #FBEAF0;
    color: #72243E;
    font-weight: 500;
    font-size: 15px;
    padding: 10px 24px;
    cursor: pointer;
    transition: transform .15s ease;
    max-width: 100%;
  }
  #app button:hover { transform: scale(1.06) rotate(-2deg); }
  #app input {
    border-radius: 999px;
    border: 0.5px solid #ED93B1;
    padding: 10px 16px;
    width: 100%;
    max-width: 280px;
    box-sizing: border-box;
    font-size: 15px;
    outline: none;
  }
  #app input:focus { border-color: #D4537E; }
  #app h2 { color: #993556; font-size: clamp(17px, 5vw, 21px); word-wrap: break-word; margin: 0 0 8px; }
  #app p.sub { color: #8a7c83; font-size: 14px; margin: 0 0 1rem; }
  .sticker {
    display: inline-block;
    font-size: clamp(26px, 7vw, 34px);
    animation: bounce 1.8s ease-in-out infinite;
  }
  .sticker:nth-child(2) { animation-delay: .3s; }
  .sticker:nth-child(3) { animation-delay: .6s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-8px) rotate(4deg); }
  }
  .float-corner {
    position: absolute;
    font-size: clamp(18px, 5vw, 26px);
    opacity: .5;
    animation: bounce 3s ease-in-out infinite;
  }
  .btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
  .photo-box {
    padding: 6px;
    background: #FBEAF0;
    border-radius: 16px;
    display: inline-block;
    border: 0.5px solid #ED93B1;
    margin: 1rem 0;
  }
  .photo-box img {
    width: 100%;
    max-width: 240px;
    aspect-ratio: 1/1;
    border-radius: 12px;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

<div id="app">
  <div id="content"></div>
</div>

<script>
// ====== EDIT THESE ======
const TARGET_NAME = "Safae";          // expected first name (case-insensitive)
const TARGET_FAMILY = "Astour";       // expected last name (case-insensitive)
const PHOTO_URL = "photo.jpg";        // put your photo file next to this HTML, or use a full URL
// =========================

let state = "name";
const app = document.getElementById('content');
let noClicks = 0;

function spawnHearts() {
  for (let i = 0; i < 12; i++) {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = '❤️';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (8 + Math.random() * 8) + 's';
    h.style.animationDelay = (Math.random() * 8) + 's';
    h.style.fontSize = (18 + Math.random() * 22) + 'px';
    document.body.appendChild(h);
  }
}
spawnHearts();

function dodge(btn) {
  btn.style.position = 'relative';
  const move = () => {
    const maxX = 80, maxY = 40;
    const x = (Math.random() - 0.5) * maxX * 2;
    const y = (Math.random() - 0.5) * maxY * 2;
    btn.style.transform = `translate(${x}px, ${y}px)`;
  };
  btn.addEventListener('mouseenter', move);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); move(); }, { passive: false });
}

function stickers(emojis) {
  return `<div style="margin-bottom:8px">${emojis.map(e => `<span class="sticker">${e}</span>`).join(' ')}</div>`;
}

const corners = `
  <span class="float-corner" style="top:8px;left:10px">🌸</span>
  <span class="float-corner" style="top:10px;right:14px;animation-delay:1s">💌</span>
  <span class="float-corner" style="bottom:8px;left:14px;animation-delay:1.6s">🧸</span>
  <span class="float-corner" style="bottom:10px;right:10px;animation-delay:.8s">✨</span>
`;

function render() {
  if (!document.querySelector('.float-corner')) {
    document.getElementById('app').insertAdjacentHTML('beforeend', corners);
  }

  if (state === "name") {
    app.innerHTML = `
      ${stickers(['🕵️‍♀️','💗','🕵️'])}
      <h2>Top secret mission briefing 🤫</h2>
      <p class="sub">Step 1: state your name for the record.</p>
      <input id="nameInput" type="text" placeholder="Your name" />
      <br/>
      <div class="btn-row"><button id="nameBtn">Submit for review 📋</button></div>
    `;
    document.getElementById('nameBtn').onclick = () => {
      const val = document.getElementById('nameInput').value.trim().toLowerCase();
      if (val === TARGET_NAME.toLowerCase()) {
        state = "family";
        render();
      } else {
        state = "direct";
        render();
      }
    };
  }

  else if (state === "family") {
    app.innerHTML = `
      ${stickers(['🚨','💗','🚨'])}
      <h2>Whoa, ${TARGET_NAME}?! Alarm bells! 🔔</h2>
      <p class="sub">Step 2: I need a last name to confirm you're not an impostor 👀</p>
      <input id="famInput" type="text" placeholder="Your last name" />
      <br/>
      <div class="btn-row"><button id="famBtn">Verify identity 🔍</button></div>
    `;
    document.getElementById('famBtn').onclick = () => {
      const val = document.getElementById('famInput').value.trim().toLowerCase();
      if (val === TARGET_FAMILY.toLowerCase()) {
        state = "photo";
        render();
      } else {
        state = "direct";
        render();
      }
    };
  }

  else if (state === "photo") {
    app.innerHTML = `
      ${stickers(['🎯','💖','🎯'])}
      <h2>JACKPOT! Identity confirmed ✅</h2>
      <p class="sub">Quick sanity check before I embarrass myself...</p>
      <div class="photo-box">
        <img src="${PHOTO_URL}" alt="photo"/>
      </div>
      <p style="font-size:16px">Is this the legendary face in question?</p>
      <div class="btn-row">
        <button id="photoYes">Yep, that's me 💕</button>
        <button id="photoNo">Nope, wrong human</button>
      </div>
    `;
    document.getElementById('photoYes').onclick = () => { state = "loveQ"; render(); };
    document.getElementById('photoNo').onclick = () => {
      app.innerHTML = `${stickers(['😅','🌷'])}<h2>Oops, false alarm</h2><p class="sub">Carry on, citizen. Nothing to see here.</p>`;
    };
  }

  else if (state === "loveQ") {
    noClicks = 0;
    renderLoveQ();
  }

  else if (state === "direct") {
    app.innerHTML = `
      ${stickers(['🎲','💌'])}
      <h2>Random question, no context</h2>
      <p class="sub">Do you, by any chance, have a crush on me?</p>
      <div class="btn-row">
        <button id="dYes">Yes</button>
        <button id="dNo">No</button>
      </div>
    `;
    const handler = () => {
      app.innerHTML = `${stickers(['🙂','🍃'])}<h2>Cool, cool, cool</h2><p class="sub">Anyway, pretend this never happened 👋</p>`;
    };
    document.getElementById('dYes').onclick = handler;
    document.getElementById('dNo').onclick = handler;
  }
}

function renderLoveQ() {
  const prompts = [
    "Okay real talk — do you like me back? 👀",
    "I'll just leave this button right here, no pressure 😌",
    "The button is getting thirsty for attention 🥤",
    "It's basically a billboard now 🚧",
    "Okay this is out of control 😂"
  ];
  const maxStage = prompts.length - 1;
  const stage = Math.min(noClicks, maxStage);
  const promptText = prompts[stage];

  if (stage === maxStage) {
    document.body.style.overflow = 'hidden';
    document.getElementById('app').style.display = 'none';
    const fullYes = document.createElement('div');
    fullYes.id = 'fullYes';
    fullYes.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#D4537E;color:#FBEAF0;font-size:clamp(28px,10vw,48px);font-weight:700;cursor:pointer;z-index:9999;text-align:center;padding:1rem;';
    fullYes.textContent = 'Yes 💖';
    document.body.appendChild(fullYes);
    fullYes.addEventListener('click', showFinalMessage);
    fullYes.addEventListener('touchend', (e) => { e.preventDefault(); showFinalMessage(); });
    return;
  }

  const yesSize = 16 + noClicks * 12;
  const fontSize = 14 + noClicks * 3;

  app.innerHTML = `
    ${stickers(['💗','😳','💗'])}
    <h2>${promptText}</h2>
    <div class="btn-row" style="align-items:center">
      <button id="loveYes" style="padding:${yesSize}px ${yesSize * 1.5}px;font-size:${fontSize}px;background:#D4537E;color:#FBEAF0;border:none;width:100%;max-width:100%">Yes 💖</button>
      <button id="loveNo">No</button>
    </div>
  `;
  document.getElementById('loveYes').onclick = showFinalMessage;
  dodge(document.getElementById('loveNo'));
  document.getElementById('loveNo').onclick = () => {
    noClicks++;
    renderLoveQ();
  };
}

function showFinalMessage() {
  document.body.style.overflow = '';
  const fullYes = document.getElementById('fullYes');
  if (fullYes) fullYes.remove();
  document.getElementById('app').style.display = '';
  app.innerHTML = `
    ${stickers(['😍','💞','🥰','🎊'])}
    <h2>KNEW IT. 🥹</h2>
    <p style="font-size:clamp(17px,5vw,20px);color:#993556;font-weight:500">I love you too, ${TARGET_NAME} ${TARGET_FAMILY} 💖🌹</p>
    <p class="sub">This message will self-destruct... never. I'm keeping this forever.</p>
    <div style="font-size:clamp(22px,6vw,28px);margin-top:1rem">🌸💕🧸💕🌸</div>
  `;
}

render();
</script>

</body>
</html>
